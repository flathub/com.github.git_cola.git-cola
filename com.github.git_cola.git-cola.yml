app-id: com.github.git_cola.git-cola
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: git-cola
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  append-path: '/usr/lib/sdk/rust-stable/bin'
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
rename-desktop-file: git-cola.desktop
rename-icon: git-cola
rename-appdata-file: git-cola.appdata.xml
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=gpg-agent
  - --socket=ssh-auth
  - --socket=wayland
  - --socket=x11
  - --system-talk-name=org.freedesktop.UDisks2

cleanup:
  - /lib/pkgconfig
  - /lib/python3.??/site-packages/*/tests
  - /man
  - /share/bash-completion
  - /share/doc
  - /share/gitweb
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - python3-notify2.json
  - python3-polib.json
  - python3-qtpy.json
  - python3-send2trash.json
  - name: git-cola
    buildsystem: simple
    build-commands:
      - python3 -m build --wheel --no-isolation
      - pip3 install --prefix=${FLATPAK_DEST} dist/*.whl
      - make prefix=${FLATPAK_DEST} install-desktop-files install-icons install-htmldocs
        install-metainfo
    sources:
      - type: git
        url: https://github.com/git-cola/git-cola.git
        tag: v4.19.0
        commit: 0143def8dcb3194d47ea96cc0a57fb63464a4c4f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - tcl.json
  - tk.json
  - git.json
  - git-lfs.json
